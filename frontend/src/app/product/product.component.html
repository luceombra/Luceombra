<h2>Prodotto</h2>
<hr />
<div class="card" style="width: 18rem;height: 650px;overflow: auto;">
    <div class="card-body">
        <div class="card-text">
            <div class="row">
                <div class="col-md-12" *ngIf="system && system.id != null">
                    <label><b><i class="fa fa-chevron-right"></i> Sistema : </b><img style="height: 30px;width: 30px"
                            src="{{baseUrl}}{{system.image}}" alt="{{system.name}}" /> {{system.name}}</label>
                    <br />
                </div>
            </div>
            <br />
            <div class="row">
                <div class="col-md-12" *ngIf="systemColor && systemColor.id != null">
                    <div class="color-div">
                        <label><b><i class="fa fa-chevron-right"></i> Colori di sistema : </b>{{systemColor.name}}</label>
                        <br />
                    </div>
                </div>
            </div>
            <br />
            <div class="row">
                <div class="col-md-12" *ngIf="curtain && curtain.id != null">
                    <label><b><i class="fa fa-chevron-right"></i> Tenda : </b><img style="height: 30px;width: 30px" src="{{baseUrl}}{{curtain.image}}"
                            alt="{{curtain.name}}" /> {{curtain.name}}</label>
                    <br />
                </div>
            </div>
            <br />
            <div class="row">
                <div class="col-md-12" *ngIf="curtainColor && curtainColor.id != null">
                    <div class="color-div">
                        <label><b><i class="fa fa-chevron-right"></i> Colori di tenda : </b>{{curtainColor.name}}</label>
                        <br />
                    </div>
                </div>
            </div>
            <br />
            <div class="row">
                <div class="col-md-12" *ngIf="product && product.height != '0'">
                    <div class="color-div">
                        <label><b><i class="fa fa-chevron-right"></i> Altezza : </b>{{product.height}}cm</label>
                        <br />
                    </div>
                </div>
            </div>
            <br />
            <div class="row">
                <div class="col-md-12" *ngIf="product && product.width != '0'">
                    <div class="color-div">
                        <label><b><i class="fa fa-chevron-right"></i> Larghezza : </b>{{product.width}}cm</label>
                        <br />
                    </div>
                </div>
            </div>
            <br />
            <div class="row">
                <div class="col-md-12" *ngIf="product && product.price != '0'">
                    <div class="color-div">
                        <label><b><i class="fa fa-chevron-right"></i> Prezzo : </b>{{product.shownPrice}} €</label>
                        <br />
                    </div>
                </div>
            </div>
            <br />
            <div class="row">
                <div class="col-md-12" *ngIf="product && product.motion_id == 1 && product.chain_id != 0">
                    <div class="color-div">
                        <label><b><i class="fa fa-chevron-right"></i> Tipo catena : </b> <img style="height: 30px;width: 30px"
                                src="{{baseUrl}}{{product.chain_image}}" *ngIf="product.chain_image != ''" />
                            {{product.chain}}</label>
                        <br />
                    </div>
                </div>
            </div>
            <br />
            <div class="row">
                <div class="col-md-12" *ngIf="product && product.motion_id == 2 && product.motor_id != 0">
                    <div class="color-div">
                        <label><b><i class="fa fa-chevron-right"></i> Tipo motore : </b> <img style="height: 30px;width: 30px"
                            src="{{baseUrl}}{{product.motor_image}}" *ngIf="product.motor_image != ''" />
                            {{product.motor}}
                        </label>
                        <br />
                    </div>
                </div>
            </div>
            <br />
            <div class="row">
                <div class="col-md-12" *ngIf="product && product.motion_id == 2 && product && product.telecomand_id != 0">
                    <div class="color-div">
                        <label><b><i class="fa fa-chevron-right"></i> Tipo telecomando : </b> <img style="height: 30px;width: 30px"
                                src="{{baseUrl}}{{product.telecomand_image}}" *ngIf="product.telecomand_image != ''" />
                            {{product.telecomand}}</label>
                        <br />
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
