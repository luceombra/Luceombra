<h4 mat-dialog-title>Administratore
    <hr />
  </h4>
  <form [formGroup]="motorForm" (ngSubmit)="onSubmit()">
  
    <div class="form-group">
      <label for="name">Nome e Cognome : </label>
      <input type="text" formControlName="name" class="form-control" />
      <div *ngIf="submitted && validateFunction.name.errors">
        <br />
      </div>
      <div *ngIf="submitted && validateFunction.name.errors">
        <div *ngIf="validateFunction.name.errors.required" class="alert alert-danger">
            *Nome e Cognome sono obbligatorio!
        </div>
      </div>
    </div>
  
    <div class="form-group">
        <label for="email">Email</label>
        <input type="text" formControlName="email" class="form-control" />
        <div *ngIf="submitted && validateFunction.email.errors" class="alert alert-danger">
          <br>
          <div *ngIf="validateFunction.email.errors.required">Email è obbligatorio</div>
          <div *ngIf="validateFunction.email.errors.email">Il formato dell'email non è corretto</div>
        </div>
      </div>
  
  
    <div class="">
      <label for="address">Imagini : </label>
      <div *ngIf="editMode">
        <img [src]="image" style="max-width:120px" />
      </div>
      <input type="file"  (change)="onSelectFile($event)"/>
    </div>

    <div class="form-group">
        <label for="phone">Telefono</label>
        <input type="text" formControlName="phone_number" class="form-control" />
      </div>

      <div *ngIf="showIva" class="form-group">
        <label for="iva">IVA (%)</label>
        <input type="number" min="0" formControlName="iva" class="form-control" />
        <div *ngIf="submitted && validateFunction.iva.errors" class="alert alert-danger">
          <br>
          <div *ngIf="validateFunction.iva.errors.required">IVA è obbligatorio</div>
        </div>
      </div>
  
    <br />
  
    <div class="text-right">
      <button type="button" class="mat-raised-button text-center" (click)="close()">Annulla</button>&nbsp;
      <button type="submit" class="mat-raised-button text-center mat-primary">Salva</button>
    </div>
  
  </form>
