<div class="col-sm-6 offset-sm-3">
    <div class="card">
        <div class="card-header">
            Aggiorna Password
        </div>
        <div class="card-body">
            <form [formGroup]="updatePasswordForm" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <label for="newPassword">Nuova Password</label>
                    <input type="password" (keyup)="onKeyUp($event)" formControlName="newPassword" class="form-control" />
                    <div *ngIf="submitted && f.newPassword.errors" class="invalid-feedback">
                        <br>
                        <div *ngIf="f.newPassword.errors.required">Password è obbligatorio</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="retypePassword">Ripeti Password</label>
                    <input type="password" (keyup)="onKeyUp($event)" formControlName="retypePassword"
                        class="form-control" />
                    <div *ngIf="submitted && f.retypePassword.errors" class="invalid-feedback">
                        <br>
                        <div *ngIf="f.retypePassword.errors.required">Password è obbligatorio</div>
                    </div>
                    <br />
                    <div *ngIf="this.doNotMatch.value" class="alert alert-danger">
                        Le passwords non corrispondono
                    </div>
                </div>

                <div class="form-group text-center">
                    <button [disabled]="loading" class="btn btn-primary">Aggiorna Password</button>
                </div>
            </form>
        </div>
    </div>
</div>
