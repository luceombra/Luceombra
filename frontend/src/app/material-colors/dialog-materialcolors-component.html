<h4 mat-dialog-title>Colori
    <hr />
</h4>
<form [formGroup]="motorForm" (ngSubmit)="onSubmit()">

    <div class="form-group">
        <label for="name">Nome : </label>
        <input type="text" formControlName="name" class="form-control" />
        <div *ngIf="submitted && validateFunction.name.errors">
            <br />
        </div>
        <div *ngIf="submitted && validateFunction.name.errors">
            <div *ngIf="validateFunction.name.errors.required" class="alert alert-danger">
                *Nome non dovrebbe essere vuoto!
            </div>
        </div>
    </div>

    <div class="form-group">
        <label for="value">Colori : </label>
        <input  [(colorPicker)]="color" (colorPickerChange)="onSelectColor($event)" formControlName="value" [style.background]="color" class="form-control"/>
        <!-- <input type="text" formControlName="value" class="form-control" /> -->
        <div *ngIf="submitted && validateFunction.value.errors">
            <br />
        </div>
        <div *ngIf="submitted && validateFunction.value.errors">
            <div *ngIf="validateFunction.value.errors.required" class="alert alert-danger">
                *Colori non dovrebbe essere vuoto!
            </div>
        </div>
    </div>

    <div class="">
        <label for="address">Imagini : </label>
        <div *ngIf="editMode">
            <img [src]="image" style="max-width:120px" />
        </div>
        <input type="file"  (change)="onSelectFile($event)"/>
    </div>

    <br />

    <div class="text-right">
        <button type="button" class="mat-raised-button text-center" (click)="close()">Annulla</button>&nbsp;
        <button type="submit" class="mat-raised-button text-center mat-primary">Salva</button>
    </div>

</form>
