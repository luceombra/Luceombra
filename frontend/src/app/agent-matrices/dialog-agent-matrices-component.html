<h4 mat-dialog-title>Telecomando
    <hr />
</h4>
<nav>
    <div class="nav nav-tabs" id="nav-tab" role="tablist">
        <a class="nav-item nav-link active" id="nav-home-tab" data-toggle="tab" href="#nav-home" role="tab" aria-controls="nav-home" aria-selected="true">Informazioni</a>
        <a class="nav-item nav-link" id="nav-motors-tab" data-toggle="tab" href="#nav-motors" role="tab" aria-controls="nav-motors" aria-selected="false">Motori</a>
    </div>
</nav>

<form [formGroup]="motorForm" (ngSubmit)="onSubmit()">
    <div class="tab-content" id="nav-tabContent">
        <div class="tab-pane fade show active" id="nav-home" role="tabpanel" aria-labelledby="nav-home-tab">

            <div class="form-group">
                <label for="name">Nome : </label>
                <input type="text" formControlName="name" class="form-control" />
                <div *ngIf="submitted && validateFunction.name.errors">
                    <br />
                </div>
                <div *ngIf="submitted && validateFunction.name.errors">
                    <div *ngIf="validateFunction.name.errors.required" class="alert alert-danger">
                        *Nome non dovrebbe essere vuoto!
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Prezzo (€): </label>
                <input type="number" formControlName="price" class="form-control" />
                <div *ngIf="submitted && validateFunction.name.errors">
                    <br />
                </div>
                <div *ngIf="submitted && validateFunction.name.errors">
                    <div *ngIf="validateFunction.name.errors.required" class="alert alert-danger">
                        *Prezzo non dovrebbe essere vuoto!
                    </div>
                </div>
            </div>

            <div class="">
                <label for="address">Imagini : </label>
                <div *ngIf="editMode">
                    <img [src]="image" style="max-width:120px" />
                </div>

                <input type="file"  (change)="onSelectFile($event)"/>
            </div>

        <!-- <div class="form-group">
        <label for="phone">Descrizione : </label>
        <input type="text" formControlName="description" class="form-control" />
        </div> -->
</div>

<div class="tab-pane fade" id="nav-motors" role="tabpanel" aria-labelledby="nav-motors-tab">
    <div class="form-group" style="font-size:15px">
        <span style="font-size:20px"> Motori</span> <br>
        <table>
            <tr *ngFor="let row of rows">
                <td *ngFor="let item of row">
                    <input type="checkbox"   [checked] ="item.checked" (change)="checkCheckBoxvalue($event, item.name)">
                    {{item.name}}
                </td>
            </tr>
        </table>
    </div>
</div>
</div>

<br />

<div class="text-right">
    <button type="button" class="mat-raised-button text-center" (click)="close()">Annulla</button>&nbsp;
    <button type="submit" class="mat-raised-button text-center mat-primary">Salva</button>
</div>

</form>
