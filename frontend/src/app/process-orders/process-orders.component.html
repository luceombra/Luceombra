<h4 mat-dialog-title>Processo ordine
    <hr />
</h4>

<div class="row">
    <div class="col-md-12">
        <div>Stato: </div>
        <div>
            <mat-radio-group [(ngModel)]="choosenState">
                <mat-radio-button *ngFor="let state of states" [value]="state">
                    {{state}}&nbsp;&nbsp;
                </mat-radio-button>
            </mat-radio-group>
        </div>
    </div>
</div>
<br />
<div class="row">
    <div class="col-md-12">
        <div class="text-right">
            <button type="button" class="mat-raised-button text-center" (click)="close()">Annulla</button>&nbsp;
            <button type="submit" class="mat-raised-button text-center mat-primary" (click)="save()">Salva</button>
        </div>
    </div>
</div>
