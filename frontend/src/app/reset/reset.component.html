<div class="col-sm-6 offset-sm-3">
    <div class="card">
        <div class="card-header">
                Resetta Password
        </div>
        <div class="card-body">
            <form [formGroup]="sendEmailForm">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="text" formControlName="email" class="form-control" />
                    <div *ngIf="submitted && f.email.errors">
                        <br>
                        <div *ngIf="f.email.errors.required" class="alert alert-danger">
                            *Email è obbligatorio!
                        </div>
                        <div *ngIf="f.email.errors.email" class="alert alert-danger">
                            *Il formato dell'email non è corretto!
                        </div>
                    </div>
                </div>
               
                <div class="form-group text-center">
                    <button [disabled]="loading" (click)="onSubmit()" class="btn btn-primary">Invia e-mail per reimpostare la password</button>
                    
                </div>
                <div class="form-group text-center">
                    
                    <button [disabled]="loading" (click)="returnLogin()" class="btn btn-secondary">Log in</button>
                </div>
            </form>
        </div>
    </div>
</div>
