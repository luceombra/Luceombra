<app-loader></app-loader>
<div [hidden]="LoaderInterceptor.getLoader" class="col-sm-6 offset-sm-3">
    <br />
    <br />
    <div class="card">
        <div class="card-header">
            Accesso
        </div>
        <div class="card-body">
            <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="text" formControlName="email" class="form-control" />
                    <div *ngIf="submitted && f.email.errors">
                        <br>
                        <div *ngIf="f.email.errors.required" class="alert alert-danger">
                            *Email è obbligatorio!
                        </div>
                        <div *ngIf="f.email.errors.email" class="alert alert-danger">
                            *Il formato dell'email non è corretto!
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" formControlName="password" class="form-control" />
                    <div *ngIf="submitted && f.password.errors">
                        <br>
                        <div *ngIf="f.password.errors.required" class="alert alert-danger">
                            *Password è obbligatorio!
                        </div>
                    </div>
                </div>
                <div class="form-group text-center">
                    <button class="btn btn-primary">Accesso</button>
                    <br />
                    <a routerLink="/reset" class="btn btn-link">Resetta Password</a>
                </div>
            </form>
        </div>
    </div>
</div>
