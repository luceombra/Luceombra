<div class="main-content">
    <form>
        <div class="form-group">
            <label for="name">Nome : </label>
            <input type="text" [value]="name" class="form-control" (input) = "changeName($event)"/>
        </div>
        <div class="">
            <label for="address">Imagini : </label>
            <div *ngIf="editMode">
                <img [src]="image" style="max-width:120px" />
            </div>
            <input type="file" (change)="onSelectFile($event)"/>
        </div>

        <div class="form-group" style="font-size:15px">
            <span style="font-size:20px"> Colori</span> <br>
            <table>
                <tr *ngFor="let row of rowsColors">
                    <td *ngFor="let item of row">
                        <input style="margin-left: 20px;" type="checkbox"  [checked] ="item.checked" (change)="checkColor($event, item.id)">
                        {{item.name}}
                    </td>
                </tr>
            </table>
        </div>

        <br />
        <button mat-raised-button (click)="openDialog()">Inserisci</button>
        <br><br>

        <table class="mat-elevation-z8" style="width:100%" mat-table
        [dataSource]="dataSource" matSort>

        <ng-container matColumnDef="index">
            <th mat-header-cell *matHeaderCellDef> No. </th>
            <td mat-cell *matCellDef="let element; let i = index;">
            {{this.tableConfigs.pageNumber * this.tableConfigs.pageSize + i + 1}} </td>
        </ng-container>

        <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef> Sistemi </th>
            <td mat-cell *matCellDef="let row"> {{row.name}} </td>
        </ng-container>

        <ng-container matColumnDef="priceName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Tipo di prezzo </th>
            <td mat-cell *matCellDef="let row"> {{row.priceName}} </td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Azioni</th>
            <td mat-cell *matCellDef="let row">
                <button (click)="updateSystem(row)" class="btn btn-success btn-sm">
                    <i class="fa fa-pencil-square-o" aria-hidden="true"></i>
                </button>
                <button (click)="deleteSystem(row.id)" class="btn btn-danger btn-sm"><i
                    class="fa fa-trash" aria-hidden="true"></i></button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;let i = index">
            </tr>
        </table>
        <br>
        <br>
        <div class="text-right">
            <button type="button" class="mat-raised-button text-center" (click)="close()">Annulla</button>&nbsp;
            <button type="submit" class="mat-raised-button text-center mat-primary" (click)= "onSubmit()">Salva</button>
        </div>
    </form>
</div>
