<div class="main-content">
	<div class="container-fluid">

		<mat-form-field>
			<input matInput (keyup.enter)="applyFilter($event.target.value)" placeholder="Filter">
		</mat-form-field>

		<div>
			<table (matSortChange)="sortData($event)" class="mat-elevation-z8" style="width:100%" mat-table
			[dataSource]="dataSource" matSort>

			<ng-container matColumnDef="index" sticky>
				<th class="text-center" mat-header-cell *matHeaderCellDef> No. </th>
				<td class="text-center" mat-cell *matCellDef="let element; let i = index;">
				{{this.tableConfigs.pageNumber * this.tableConfigs.pageSize + i + 1}} </td>
			</ng-container>

			<ng-container matColumnDef="view">
				<th mat-header-cell *matHeaderCellDef>Vista</th>
				<td mat-cell *matCellDef="let row">
					<button (click)="viewPreventive(row.preventive_id)" class="btn btn-primary btn-sm"><i class="fa fa-eye"
						aria-hidden="true"></i></button>
					</td>
				</ng-container>

				<ng-container matColumnDef="invoiceNo">
					<th mat-header-cell *matHeaderCellDef mat-sort-header> Conferma d’ordine </th>
					<td mat-cell *matCellDef="let row"> {{row.invoiceNo}} </td>
				</ng-container>

				<ng-container matColumnDef="download">
					<th mat-header-cell *matHeaderCellDef> PDF </th>
					<td mat-cell *matCellDef="let row">
						<a href="{{ baseUrl + row.pdf }}" class="btn btn-default btn-sm" target="_blank"><i class="fa fa-download" aria-hidden="true"></i></a>
					</td>
				</ng-container>

				<ng-container matColumnDef="downloadAdminPdf">
					<th mat-header-cell *matHeaderCellDef>Admin PDF</th>
					<td mat-cell *matCellDef="let row">
						<a href="{{ baseUrl + row.adminPdf }}" class="btn btn-default btn-sm" target="_blank"><i class="fa fa-download" aria-hidden="true"></i></a>
					</td>
				</ng-container>

				<ng-container matColumnDef="client">
					<th mat-header-cell *matHeaderCellDef mat-sort-header> Nome </th>
					<td mat-cell *matCellDef="let row"> {{row.client}} </td>
				</ng-container>

				<ng-container matColumnDef="actions" stickyEnd>
					<th class="text-center" mat-header-cell *matHeaderCellDef> Azioni </th>
					<td class="text-center" mat-cell *matCellDef="let row">
						<button *ngIf="user.role != 'manager'" (click)="deleteInvoice(row.id)" class="btn btn-danger btn-sm"><i
							class="fa fa-trash" aria-hidden="true"></i></button>
						</td>
					</ng-container>

					<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
					<tr mat-row *matRowDef="let row; columns: displayedColumns;let i = index">
					</tr>
				</table>

				<mat-paginator [length]="totalCount" [pageIndex]="this.tableConfigs.pageNumber"
				[pageSize]="this.tableConfigs.pageSize" (page)="getPaginatorData($event)" [pageSizeOptions]="[5, 10, 25, 100]">
			</mat-paginator>
		</div>
	</div>
</div>
